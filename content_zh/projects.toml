[[items]]
title = "四足机器狗与 SPARC 主动柔性脊柱"
subtitle = "自研整机，8 自由度，6.66 kg"
date = "2023 至今"
content = "机械结构、传动、电控板和整机装配都是从零做的，另外做了 SPARC —— 一个 1.26 kg、3 自由度的柔性脊柱模块。刚体动力学、任务空间阻抗控制和摩擦补偿在自己画的 STM32G473 板子上，跑在 FreeRTOS 里，1 kHz 闭环。台架实验覆盖 300 至 700 N/m 的指令刚度，跟踪误差不超过 1.5%；实机上 97 次 bounding 实验，最高速度 1.029 m/s。"
tags = ["Inventor", "STM32G473", "FreeRTOS", "CAN", "阻抗控制", "RNEA / CRBA"]
link = "https://github.com/YueWang996/sparc"
image = "/spined_dog.png"

[[items]]
title = "主动脊柱到底给学出来的步态带来什么"
subtitle = "Isaac Lab，对抗式动作先验"
date = "2025 至今"
content = "把猎豹奔跑的动捕片段重定向到 11 自由度的带脊柱四足模型上，当作 AMP 的风格参考。三种脊柱范式用完全相同的奖励、网络和训练日程训练，唯一的差别是脊柱的控制接口：刚性锁死、端到端直接驱动、任务空间阻抗。结论是脊柱并不降低稳态运输成本；端到端主动脊柱最接近猎豹的步态学，3 m/s 时步长比刚性长约 35%；任务空间阻抗脊柱抗扰性最好。"
tags = ["Isaac Lab", "AMP", "PPO / skrl", "Newton / MJWarp"]
image = "/rl_training.jpg"

[[items]]
title = "BARD"
subtitle = "GPU 批量可微分刚体动力学"
date = "2026"
content = "原生 PyTorch 写的浮动基机器人动力学库，支持 URDF、FK、Jacobian、RNEA、CRBA、ABA 和自动微分，可以直接接进强化学习或轨迹优化。H200、batch=4096 下，FK 与 Jacobian 吞吐分别达到 Pinocchio 的 64 倍与 63 倍。"
tags = ["PyTorch", "自动微分", "GPU", "ICANN 2026"]
link = "https://github.com/YueWang996/bard-pytorch-dynamics"

[[items]]
title = "Quattro"
subtitle = "Transformer 加速 iLQR / MPC"
date = "2025"
content = "用 Transformer 并行预测 iLQR 的反馈和前馈矩阵，再把算法和 FPGA 做软硬件协同部署。四旋翼单次优化迭代最高提速 27 倍，MPC 整体提速 17.8 倍，FPGA 上最高 27.3 倍。"
tags = ["Transformer", "iLQR / MPC", "FPGA", "IEEE CDC 2025"]
link = "https://github.com/YueWang996/quattro-transformer-ilqr"

[[items]]
title = "FOCX"
subtitle = "电机驱动与双轮足机器人"
date = "2021 — 2022"
content = "基于 ESP32 的低成本 BLDC 矢量控制板，位置、速度、力矩三个闭环都做了。用这块驱动搭了一台双轮足机器人，靠 LQR 站住。"
tags = ["FOC / BLDC", "ESP32", "LQR", "Altium"]
link = "https://github.com/YueWang996/FOCX"
image = "/pcb.jpg"
